<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer/User Login</title>
</head>
<body>

    <div class="mode-switch">
        <button id="dev-mode" class="active">Developer</button>
        <button id="user-mode">User</button>
    </div>

    <div id="forms-container">
        <!-- Login Form -->
        <form id="login-form">
            <h2>Login</h2>
            <div class="input-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="input-group">
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">Login</button>
            <p>Or</p>
            <button type="button" id="google-login">Sign in with Google</button>
            <p>Don't have an account? <span id="show-signup">Create an Account</span></p>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" style="display: none;">
            <h2>Create Account</h2>
            <div class="input-group">
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" required>
            </div>
            <div class="input-group">
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" required>
            </div>
            <button type="submit">Sign Up</button>
            <p>Already have an account? <span id="show-login">Login</span></p>
        </form>
    </div>

    <script>
        const devBtn = document.getElementById('dev-mode');
        const userBtn = document.getElementById('user-mode');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const showSignup = document.getElementById('show-signup');
        const showLogin = document.getElementById('show-login');

        let currentMode = 'developer';

        devBtn.addEventListener('click', () => {
            currentMode = 'developer';
            devBtn.classList.add('active');
            userBtn.classList.remove('active');
            console.log('Switched to Developer Mode');
        });

        userBtn.addEventListener('click', () => {
            currentMode = 'user';
            userBtn.classList.add('active');
            devBtn.classList.remove('active');
            console.log('Switched to User Mode');
        });

        showSignup.addEventListener('click', () => {
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
        });

        showLogin.addEventListener('click', () => {
            signupForm.style.display = 'none';
            loginForm.style.display = 'block';
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            console.log(`Logging in as ${currentMode} with Email: ${email}`);
        });

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            console.log(`Signing up as ${currentMode} with Email: ${email}`);
        });
    </script>
</body>
</html>
