<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Login | Freelancing Hub</title><link rel="stylesheet" href="style.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f766e;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px;color:#fff}.login{width:min(460px,100%);background:#0f172a;border-radius:24px;padding:clamp(24px,5vw,42px);box-shadow:0 25px 70px #042f2e55}.brand{text-align:center;font-weight:900;font-size:20px;margin-bottom:8px}.sub{text-align:center;color:#cbd5e1;margin-bottom:28px}.login h1{text-align:center}.field{display:grid;gap:7px;margin:15px 0}label{font-size:13px;color:#dbeafe}input{width:100%;padding:13px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:white}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:#99f6e4;color:#0f172a;font-weight:800;cursor:pointer}.link{display:block;text-align:center;color:#99f6e4;margin-top:17px;text-decoration:none;font-size:13px}.msg{text-align:center;color:#fda4af;min-height:18px;font-size:13px}.hint{font-size:11px;color:#94a3b8;text-align:center;line-height:1.6;margin-top:20px}
</style></head><body><main class="login"><div class="brand">✣ Freelancing Hub</div><p class="sub">Developer workspace · Secure area</p><h1>Developer Login</h1><form id="form"><div class="field"><label for="email">Developer email</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><button class="btn">LOGIN AS DEVELOPER →</button></form><p class="msg" id="msg" role="status"></p><a class="link" href="signup.html" id="signup">Create developer account</a><a class="link" href="index.html">← Back to public landing page</a><p class="hint">Demo only: this version uses browser storage. Use server-side authentication before publishing publicly.</p></main><script>
const current=JSON.parse(localStorage.getItem('freelancingHubCurrentUser')||'null');if(current?.role==='Developer')location.replace('developer.html');
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const email=document.querySelector('#email').value.trim().toLowerCase(),password=document.querySelector('#password').value,users=JSON.parse(localStorage.getItem('freelancingHubUsers')||'[]');const u=users.find(x=>x.email.toLowerCase()===email&&x.password===password&&x.role==='Developer');if(!u){document.querySelector('#msg').textContent='Developer account not found. Check details or create a developer account.';return;}const p={name:u.name,email:u.email,phone:u.phone||'',role:'Developer',joinedAt:new Date().toISOString()};localStorage.setItem('freelancingHubProfile',JSON.stringify(p));localStorage.setItem('freelancingHubCurrentUser',JSON.stringify(p));location.href='developer.html';});document.querySelector('#signup').addEventListener('click',()=>sessionStorage.setItem('freelancingHubRole','Developer'));
</script>  <script src="assistant.js"></script>
</body></html>
